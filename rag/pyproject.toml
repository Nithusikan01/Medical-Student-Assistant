[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-application"
version = "0.1.0"
description = "RAG engine: PDF ingestion, hybrid retrieval, reranking, and Gemini generation"
requires-python = ">=3.11"

authors = [
{ name = "T. Nithusikan" }
]

dependencies = [
    "pypdf",
    "python-dotenv",
    "google-genai",
    "sentence-transformers",
    "torch",
    "pinecone",
    "rank-bm25",
    "langchain-text-splitters",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "black",
    "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
