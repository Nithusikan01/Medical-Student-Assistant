# The whole backend on one Lightsail instance: Postgres, the API, and Caddy in
# front of it. CloudFront terminates HTTPS and forwards /api/* and /health* here
# over plain HTTP on port 80 - see LIGHTSAIL_DEPLOYMENT.md.
#
# Lives at /opt/msa on the server, next to the real .env (never committed).
# Compose reads that same .env for the ${...} interpolation below, and the
# backend also receives it whole as its environment.

name: msa

x-logging: &logging
  # Without a cap, json-file logs grow until the disk is full.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # Must be the same major version as the RDS instance the data is restored
    # from (18.3), or newer - pg_restore will not load a dump into an older
    # server.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: medical_assistant
    # Sized for a 2 GB box shared with the API; no ports published, so only
    # containers on this compose network can reach it.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
    # From 18 the image keeps its data in a versioned subdirectory
    # (/var/lib/postgresql/18/docker) and refuses to start if a volume is
    # mounted at the old .../data path, so the mount point is the parent.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medical_assistant"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  backend:
    # IMAGE_TAG is the commit SHA during a CI deploy; a bare manual
    # `docker compose up -d` falls back to whatever main last pushed.
    image: ghcr.io/nithusikan01/medical-student-assistant-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # One process on purpose: the response cache and BM25 index are
    # per-process, so a second worker would hold a second, diverging copy.
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # Fails the deploy rather than starting with an empty secret, which
      # would leave the header check comparing against nothing.
      ORIGIN_SECRET: ${ORIGIN_SECRET:?ORIGIN_SECRET must be set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend
    logging: *logging

volumes:
  pgdata:
  caddy_data:
