name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Runs tsc -b first, so this also type-checks.
      - run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # --delete removes files from the bucket that no longer exist in this
      # build - Vite fingerprints filenames per build, so stale bundles from
      # earlier deploys would otherwise accumulate forever.
      - name: Sync to S3
        run: aws s3 sync dist/ s3://medical-student-assistant-frontend-519035820911 --delete

      # Without this, CloudFront keeps serving the previous build's cached
      # index.html/JS/CSS to visitors for a while even after S3 has the
      # new files.
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E39FPVC302KYZF --paths "/*"
