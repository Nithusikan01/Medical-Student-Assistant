name: PR checks

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      docker: ${{ steps.filter.outputs.docker }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      # For a pull_request event this diffs against the PR's base ref; for a
      # push it diffs against the commit before the push. Either way, a job
      # skipped because its paths didn't change still reports as a passing
      # (skipped) check, so it satisfies branch protection's required checks.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'rag/**'
              - 'backend/**'
              - '.github/workflows/pr-checks.yml'
            docker:
              - 'rag/**'
              - 'backend/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/pr-checks.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/pr-checks.yml'

  python:
    name: Python tests and lint
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        # No local-models extra: the app runs on hosted inference, so CI does
        # not need PyTorch and installs in seconds rather than minutes.
        run: |
          python -m pip install --upgrade pip
          pip install -e ./rag -e "./backend[dev]"

      - name: Lint and format check
        run: |
          pip install "ruff==0.16.6" "black==25.1.0"
          ruff check rag/src rag/tests backend/src backend/tests
          black --check rag/src rag/tests backend/src backend/tests

      - name: Engine tests
        working-directory: rag
        run: pytest tests/unit -q

      - name: API tests
        working-directory: backend
        # tests/unit and tests/api both run against a throwaway SQLite file,
        # so no Postgres service is needed. tests/integration skips itself
        # without RUN_REAL_RAG_TESTS.
        run: pytest -q

  docker:
    name: Backend image builds
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Frontend build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `npm run build` runs `tsc -b` first, so this type-checks as well.
      - run: npm run build
