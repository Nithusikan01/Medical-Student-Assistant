name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "rag/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

# Never let two deploys race: a half-applied migration alongside a rollback
# is far worse than waiting.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ./rag -e "./backend[dev]"

      - name: Test before deploying
        run: |
          pytest rag/tests/unit -q
          pytest backend/tests -q

      # Schema first: code that expects a column must never reach users
      # before the column exists. Koyeb's own auto-deploy is left switched
      # off so this ordering is guaranteed rather than a race.
      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set." >&2
            exit 1
          fi
          alembic upgrade head
          alembic current

      - name: Install the Koyeb CLI
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}

      # KOYEB_SERVICE is a repository variable shaped "app-name/service-name".
      - name: Redeploy
        env:
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
        run: |
          if [ -z "$KOYEB_SERVICE" ]; then
            echo "Set the KOYEB_SERVICE repository variable, e.g. msa/api." >&2
            exit 1
          fi
          koyeb service redeploy "$KOYEB_SERVICE"
          echo "Redeploy requested. Koyeb builds the image from the Dockerfile;"
          echo "watch progress at https://app.koyeb.com/"
