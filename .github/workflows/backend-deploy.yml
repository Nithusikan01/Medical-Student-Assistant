name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "rag/**"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/lightsail/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

# Never let two deploys race: a half-applied migration alongside a rollback
# is far worse than waiting.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

# packages: write pushes the image to GHCR with the workflow's own
# GITHUB_TOKEN - no registry credentials stored anywhere. The same token
# (read-only use) lets the server pull it, and expires when the job ends.
permissions:
  contents: read
  packages: write

env:
  # GHCR names must be lowercase.
  IMAGE_NAME: ghcr.io/nithusikan01/medical-student-assistant-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ./rag -e "./backend[dev]"

      - name: Test before deploying
        run: |
          pytest rag/tests/unit -q
          pytest backend/tests/unit backend/tests/api -q

      # Built here rather than on the server: a 2 GB instance should spend its
      # memory serving requests, not compiling wheels.
      - name: Build and push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE_NAME:${{ github.sha }}" -t "$IMAGE_NAME:latest" -f Dockerfile .
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

      # The host key is pinned from a secret rather than ssh-keyscan'd here, so
      # a spoofed host can't receive the deploy (or the registry token).
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host lightsail
            HostName ${{ secrets.LIGHTSAIL_HOST }}
            User ${{ secrets.LIGHTSAIL_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      # deploy.sh migrates before it restarts anything and exits non-zero if
      # the migration or the health check fails, which fails this job.
      - name: Deploy to Lightsail
        run: |
          scp deploy/lightsail/docker-compose.yml deploy/lightsail/Caddyfile deploy/lightsail/deploy.sh lightsail:/opt/msa/
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh lightsail "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh lightsail "bash /opt/msa/deploy.sh '${{ github.sha }}'"
