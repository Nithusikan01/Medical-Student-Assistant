[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-backend"
version = "0.1.0"
description = "FastAPI HTTP layer over the RAG engine"
requires-python = ">=3.11"

authors = [
{ name = "T. Nithusikan" }
]

# rag-engine is a local path dependency, installed separately:
#   python -m pip install -e ./rag
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "python-dotenv",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "email-validator>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "black",
    "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "../rag/src"]
markers = [
    "closed_registration: build the AuthConfig with ALLOW_OPEN_REGISTRATION off",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
